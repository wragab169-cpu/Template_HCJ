<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Template HTML CSS JS</title>
        <!-- FONT AWESOME -->
    <script src="https://kit.fontawesome.com/da88a7eef3.js" crossorigin="anonymous"></script> 
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="toast-container"></div>
<!-- Start Settings Box -->
    <div class="settings-box">
      <div class="gear"><i class="fa-solid fa-gear"></i></div>
      <div class="setting-container">
        <div class="options">
          <h4>Colors Options</h4>
          <ul class="colors-list">
            <li class="active" data-color="#ff9800"></li>
            <li data-color="red"></li>
            <li data-color="blueviolet"></li>
            <li data-color="yellow"></li>
            <li data-color="orangered"></li>
          </ul>
        </div>
        <div class="options">
          <button id="toggle-theme"><i class="fa-solid fa-moon"></i></button>
        </div>
        <div class="options">
          <h4>Random Backgrounds</h4>
          <div class="random-backgrounds">
            <span class="yes active" data-background="yes">Yes</span>
            <span class="no" data-background="no">No</span>
          </div>
        </div>
      </div>
    </div>
<!-- End Settings Box -->
<!-- Start Header -->
    <header>
      <div class="logo">alwafagad</div>
      <i id="toggle-menu">&#9776</i>
      <ul id="navMenu">
        <li data-page="home" class="active"> Home</li>
        <li data-page="about"> About</li>
        <li data-page="services"> Services</li>
        <li data-page="products"> Products</li>
        <li data-page="contact"> Contact</li>
      </ul>
    </header>
    <!-- End Header -->
    <!-- Start Landing Page -->
    <section id="home" class="page landing active">
      <div class="overlay">
        <div class="container">
          <div class="intro-text">
            <h1>We are <span>creative</span> developers</h1>
            <p>
              Lorem ipsum dolor sit amet consectetur adipisicing elit. Rerum
              voluptas animi reprehenderit ipsam earum
            </p>
            <div class="btn-container">
              <button>Join Developers</button>
              <button>See Products</button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- End Landing Page -->
    <!-- Start About Page -->
      <section id="about" class="page">
        <div class="container">
          <h1>About Us</h1>
          <p>We are Profesional developers</p>
        </div>
      </section>
    <!-- End About Page -->
    <!-- Start Services Page -->
      <section id="services" class="page">
        <div class="container">

        </div>
      </section>
    <!-- End Services Page -->
    <!-- Start Products Page -->
      <section id="products" class="page">
        <div class="container">

        </div>
      </section>
    <!-- End Products Page -->
    <!-- Start Contact Page -->
      <section id="contact" class="page">
        <div class="container">

        </div>
      </section>
    <!-- End Contact Page -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
